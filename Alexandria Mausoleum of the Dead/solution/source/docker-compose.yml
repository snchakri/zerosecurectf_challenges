version: '3.8'

services:
  app:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    networks:
      - ctf_net
    restart: always

  bot:
    build: ./bot
    depends_on:
      - app
    environment:
      - APP_URL=http://app:3000
    networks:
      - ctf_net
    restart: always

networks:
  ctf_net:
    driver: bridge
